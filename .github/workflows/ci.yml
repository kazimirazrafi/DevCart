name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint, typecheck, build
    runs-on: ubuntu-latest

    env:
      # No backend runs in CI, so a placeholder gets past the storefront's env
      # check; pages that fetch data fail soft.
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only a critical advisory fails the build: Medusa's transitive dependencies
      # carry high findings this repository cannot patch.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

      # .env files are not committed; copy the templates a clean checkout needs.
      - name: Prepare environment files
        run: |
          cp apps/backend/.env.template apps/backend/.env
          cp apps/storefront/.env.template apps/storefront/.env.local

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # The storefront's unit tests need no database; the backend's suites boot a
      # real app against Postgres in their own job below.
      - name: Test
        run: pnpm --filter @dtc/storefront run test

      - name: Build
        run: pnpm run build

  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest

    # The suites create and drop their own databases, so the service only needs a
    # user with the right to create one. Credentials come from the DB_* values.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # .env files are not committed; the database comes from the service above.
      - name: Prepare environment files
        run: cp apps/backend/.env.template apps/backend/.env

      # Unit, module-integration and HTTP-integration, cheapest first.
      - name: Unit, module and HTTP suites
        run: pnpm --filter @dtc/backend run test
